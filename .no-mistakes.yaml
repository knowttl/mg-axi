agent: codex
agent_args_override:
  codex:
    - -m
    - gpt-6.1-sol
    - -c
    - model_reasoning_effort="medium"
no_ci: true
commands:
  prepare: 'node tools/isolated-home.mjs corepack pnpm install --frozen-lockfile --ignore-scripts --config.confirm-modules-purge=false'
  test: 'node tools/isolated-home.mjs corepack pnpm run build && corepack pnpm test'
  lint: 'node tools/isolated-home.mjs corepack pnpm run lint'

document:
  instructions: |
    README.md owns the overview, installation and first actions.
    skills/mg-axi/SKILL.md and docs/commands.md are generated from the command
    catalogue; docs/ owns detailed behavior, authorization and pack references.
    PLAN.md is the approved design authority; historical slice plans are preserved
    on archive/internal-docs.
    docs/inventory.md and inventory/schema.json own discovery semantics; scheduled
    operations and unresolved evidence never count as implemented capabilities.
review:
  path_instructions:
    - path: "**"
      instructions: |
        Test quality: apply the "Test quality" rules in CONTRIBUTING.md to every added or changed test. Flag each violation as a finding naming the rule number, the test file:line and the evidence. Respect the listed exemptions. Never ask for a test to be written first or only to raise coverage.
    - path: "src/**/auth*.ts"
      instructions: |
        Dedicated tenant/client/cloud identity is mandatory. Delegated and
        application modes must remain separate; no implicit login or fallback.
        Tests must never sign in to a tenant or call real Graph endpoints.
    - path: "src/**/token*.ts"
      instructions: |
        Tokens are opaque. Never decode JWTs to establish identity or put tokens,
        secrets or private keys in argv, profile JSON, diagnostics or output.
    - path: "src/**/redact*.ts"
      instructions: |
        Protected values must be redacted from success output, errors, previews,
        logs and audit payloads. Full output never disables redaction.
    - path: "src/**/policy*.ts"
      instructions: |
        Unknown operations fail closed. Raw writes, secret-returning operations
        and beta writes stay blocked. Forced read-only always wins; read overrides
        cannot broaden immutable tenant and operation write scope.
    - path: "src/**/write*.ts"
      instructions: |
        Follow docs/execution.md: hand enablement, immutable scope, preview,
        execute and confirmation gates, durable audit-before-send and no blind
        replay after unknown outcomes. Do not assume universal ETags or rollback.
auto_fix:
  review: 1
  test: 3
  lint: 0
