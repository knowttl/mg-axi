name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build + Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --config.confirm-modules-purge=false
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm run lint
      - name: Generated docs freshness
        run: pnpm run docs:check
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/inventory.py validate
      - run: python -m unittest discover -s tools -p 'test_*.py'
